{% extends 'base.html' %}{% block content %}<h1 class="h3">Relatórios Operacionais</h1><p class="text-secondary">Exemplo de relatório derivado das tabelas operacionais.</p><div class="card shadow-sm"><div class="card-header fw-semibold">Desempenho por motorista</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Motorista</th><th>Entregas</th><th>Concluídas</th><th>Taxa de sucesso</th></tr></thead><tbody>{% for m in motoristas %}<tr><td>{{m.nome}}</td><td>{{m.total}}</td><td>{{m.entregues}}</td><td><span class="badge text-bg-{{'success' if m.taxa>=90 else 'warning'}}">{{m.taxa}}%</span></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
